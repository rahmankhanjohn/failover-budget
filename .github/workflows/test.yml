name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest test_failover_budget -v
      - name: Smoke test (budget)
        run: python failover_budget.py --probe-interval 5 --fall-threshold 3 --ttl 600 --cache-propagation 60 --target 60 --json || true
      - name: Smoke test (report)
        run: python failover_budget.py --report --probe-interval 5 --fall-threshold 3 --ttl 600 --cache-propagation 60 --target 60 || true
